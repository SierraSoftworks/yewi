# Size budgets, in bytes. `cargo xtask size` fails when one is exceeded;
# change one deliberately, in the pull request that needs it.
#
# `core` is the wasm an app pays before it uses anything optional: the code
# and data sections of tests/size-probe (Yew, a button and the theme toggle)
# built in release mode, before wasm-opt and compression. The stylesheet is
# not embedded in the probe. Unused components are removed by the linker, so
# this number should not move as components are added.
core = 340000

# `stylesheet` is the compiled CSS with no opt-in features. Unlike code, every
# app ships all of it, so it grows with each core component. About one sixth
# of this after gzip.
# Approved by Ben on 2026-11-12: one stylesheet for every app, sized for the
# full core catalogue. Raising it is his decision.
stylesheet = 250000

# Every other entry is what enabling that feature may ADD: wasm on top of
# `core` plus CSS on top of `stylesheet`.
avatar-hash = 20000
charts = 70000
chrono = 105000
code = 45000
diff = 52000
highlight = 35000
highlight-syntect = 1600000
map = 80000
markdown = 20000
qr = 30000
# Mostly yew-router itself; an app that already routes pays almost none of it.
router = 150000
# About 175 KB of this is the form controls it draws with (Select, TagPicker,
# SecretInput, NumberInput and the popover under them), which an app with any
# form already ships; the schema reader and the form itself are about 95 KB.
schema-form = 285000
serde_json = 60000
terminal = 40000
