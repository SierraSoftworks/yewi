[workspace]
resolver = "3"
members = ["yewi", "yewi-fonts", "yewi-test", "site", "xtask", "tests/size-probe"]
default-members = ["yewi", "yewi-fonts", "yewi-test", "site"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Benjamin Pannell <benjamin@pannell.dev>"]
license = "MIT"
repository = "https://github.com/SierraSoftworks/yewi"

[workspace.dependencies]
yewi = { path = "yewi", version = "0.1.0" }
yewi-fonts = { path = "yewi-fonts", version = "0.1.0" }
yewi-test = { path = "yewi-test", version = "0.1.0" }

yew = { version = "0.23", default-features = false }
yew-router = "0.20"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
grass = { version = "0.13", default-features = false }
insta = "1"
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
