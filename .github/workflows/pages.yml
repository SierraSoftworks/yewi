name: Reference site

# Builds the reference site, prerenders every route to static HTML (hydrated on
# load) and publishes it to GitHub Pages at https://yewi.sierrasoftworks.com.
#
# The custom domain is set in Settings > Pages: a CNAME file in the artifact is
# ignored for deployments made from a workflow. Deep links work without a
# fallback because Pages serves `/components/button` from
# `components/button.html`; unknown paths get the prerendered `404.html`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let a deployment in progress finish; only the newest waiting run is kept.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm trunk@0.22.1
      # Served from the root of the custom domain, so no YEWI_SITE_BASE.
      - run: cargo xtask site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
